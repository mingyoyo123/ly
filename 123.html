<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCT-100 赛博朋克终端 - 小组专属版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        /* ================= 动态流体渐变背景 ================= */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        :root {
            --glass-bg: rgba(20, 25, 40, 0.45);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #e2e8f0;
            --accent-glow: #00f2fe;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* 深邃科幻的动态呼吸背景 */
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #101018);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            color: var(--text-main);
            margin: 0;
            padding: 2vh 2vw;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            gap: 25px;
            overflow-x: hidden;
        }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 242, 254, 0.5); border-radius: 10px; }

        /* ================= 左侧：控制中枢 ================= */
        .sidebar {
            width: 300px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        
        /* 侧边栏的炫光装饰 */
        .sidebar::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(0,242,254,0.05) 0%, transparent 60%);
            z-index: 0; pointer-events: none;
        }

        .brand { z-index: 1; text-align: center; margin-bottom: 30px; }
        .brand h1 { 
            margin: 0; font-size: 2.5rem; font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(135deg, #fff, #00f2fe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .brand p { margin: 5px 0 0; font-size: 0.85rem; color: #8ba1b7; text-transform: uppercase; letter-spacing: 1px; }

        .form-group { z-index: 1; margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; color: #8ba1b7; margin-bottom: 8px; }
        .form-group input {
            width: 100%; box-sizing: border-box; padding: 12px 15px;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 12px; color: #fff; font-family: monospace; transition: all 0.3s;
        }
        .form-group input:focus { border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); outline: none; }

        /* 发光连接按钮 */
        .btn-connect {
            z-index: 1; width: 100%; padding: 15px; margin-top: 10px;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            border: none; border-radius: 12px; color: #000; font-weight: bold; font-size: 1.1rem;
            cursor: pointer; transition: all 0.3s; box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }
        .btn-connect:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 242, 254, 0.6); }
        .btn-connect.connected { background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%); box-shadow: 0 0 20px rgba(67, 233, 123, 0.4); }

        .status-indicators { z-index: 1; display: flex; justify-content: space-between; margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .status-item { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: #8ba1b7; }
        .led { width: 10px; height: 10px; border-radius: 50%; background: #333; box-shadow: 0 0 5px #000; }
        .led.on { background: #38f9d7; box-shadow: 0 0 15px #38f9d7; }
        .led.err { background: #ff4655; box-shadow: 0 0 15px #ff4655; }

        /* ================= 右侧：数据大屏 ================= */
        .main-content {
            flex-grow: 1; display: flex; flex-direction: column; gap: 25px;
        }

        /* 传感器模块 (采用大卡片横向排列) */
        .sensor-module { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .sensor-card {
            background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); transition: transform 0.3s; position: relative; overflow: hidden;
        }
        .sensor-card:hover { transform: translateY(-5px); }
        .sensor-card::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 4px;
        }
        .sensor-card.temp::after { background: linear-gradient(90deg, #ff8a00, #e52e71); }
        .sensor-card.light::after { background: linear-gradient(90deg, #00c6ff, #0072ff); }

        .sensor-label { font-size: 1.1rem; color: #8ba1b7; letter-spacing: 1px; margin-bottom: 10px; }
        .sensor-value { font-size: 4.5rem; font-weight: 900; font-family: 'Courier New', Courier, monospace; margin: 10px 0; }
        
        /* 渐变文字特效 */
        .text-gradient-temp { background: linear-gradient(to right, #ff8a00, #e52e71); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .text-gradient-light { background: linear-gradient(to right, #00c6ff, #0072ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* 下方模块：执行器与阈值 */
        .bottom-module { display: grid; grid-template-columns: 3fr 2fr; gap: 25px; flex-grow: 1; }
        
        .panel {
            background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 30px; display: flex; flex-direction: column;
        }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .panel-title { font-size: 1.2rem; color: #fff; font-weight: bold; margin: 0; }

        /* 炫酷的胶囊式模式切换 */
        .mode-toggle { display: flex; background: rgba(0,0,0,0.5); border-radius: 30px; padding: 5px; position: relative; }
        .mode-btn { flex: 1; text-align: center; padding: 8px 20px; border-radius: 25px; cursor: pointer; color: #8ba1b7; font-weight: bold; z-index: 1; transition: color 0.3s; }
        .mode-btn.active { color: #000; }
        .mode-slider { position: absolute; top: 5px; bottom: 5px; width: calc(50% - 5px); background: linear-gradient(90deg, #f6d365 0%, #fda085 100%); border-radius: 25px; transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 0; }
        .mode-auto-active .mode-slider { left: 5px; }
        .mode-manual-active .mode-slider { left: calc(50%); background: linear-gradient(90deg, #84fab0 0%, #8fd3f4 100%);}

        /* 现代执行器开关 */
        .actuator-grid { display: flex; justify-content: space-around; align-items: center; flex-grow: 1; }
        .actuator-item { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .actuator-icon { font-size: 3rem; filter: grayscale(100%) opacity(0.5); transition: all 0.4s; }
        .actuator-icon.active { filter: grayscale(0%) opacity(1); filter: drop-shadow(0 0 15px currentColor); transform: scale(1.1); }
        
        /* 苹果风格的大号 Switch */
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.5); transition: .4s; border-radius: 34px; border: 1px solid rgba(255,255,255,0.1); }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 3px; bottom: 3px; background-color: #8ba1b7; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.5); border-color: transparent; }
        input:checked + .slider:before { transform: translateX(26px); background-color: #fff; }
        input:disabled + .slider { opacity: 0.3; cursor: not-allowed; }

        /* 阈值输入组 */
        .th-group { background: rgba(0,0,0,0.2); border-radius: 16px; padding: 15px 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
        .th-info { display: flex; flex-direction: column; }
        .th-label { font-size: 0.85rem; color: #8ba1b7; }
        .th-current { font-size: 1.2rem; font-weight: bold; color: #fff; }
        .th-input-area { display: flex; gap: 10px; }
        .th-input-area input { width: 70px; background: rgba(0,0,0,0.5); border: 1px solid #4facfe; color: #fff; border-radius: 8px; padding: 5px 10px; text-align: center; }
        .th-input-area button { background: rgba(79, 172, 254, 0.2); border: 1px solid #4facfe; color: #4facfe; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-weight: bold; }
        .th-input-area button:hover { background: #4facfe; color: #000; }

        /* 悬浮日志终端 */
        .terminal-container { position: fixed; bottom: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; align-items: flex-end; }
        .terminal-btn { background: rgba(20, 25, 40, 0.8); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); color: #fff; padding: 10px 20px; border-radius: 30px; cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .terminal-box { width: 400px; height: 200px; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); border: 1px solid #333; border-radius: 16px; margin-top: 10px; padding: 15px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .log-time { color: #5c6370; margin-right: 8px; }
        .log-msg { color: #98c379; }
        .log-err { color: #e06c75; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <h1>PCT-100</h1>
            <p>Advanced Control System</p>
        </div>

        <div class="form-group">
            <label>🌐 MQTT 服务器 (Websocket)</label>
            <input type="text" id="server-env" value="47.98.170.180" readonly>
        </div>
        
        <div class="form-group">
            <label>🎯 设备节点 ID</label>
            <input type="text" id="device-id" value="PCT_100_002">
        </div>

        <div class="form-group">
            <label>🔑 访问密钥 (Password)</label>
            <input type="password" id="mqtt-pwd" value="Jp4!sQ7$">
        </div>

        <button id="connect-btn" class="btn-connect" onclick="toggleConnection()">启动核心连接</button>

        <div class="status-indicators">
            <div class="status-item"><div id="mqtt-led" class="led"></div> 服务器</div>
            <div class="status-item"><div id="dev-led" class="led"></div> 设备在线</div>
        </div>
    </aside>

    <main class="main-content">
        
        <section class="sensor-module">
            <div class="sensor-card temp">
                <div class="sensor-label">🌡️ 反应釜核心温度 (DS18B20)</div>
                <div class="sensor-value text-gradient-temp"><span id="val-temp">--.-</span><span style="font-size: 2rem;">℃</span></div>
            </div>
            <div class="sensor-card light">
                <div class="sensor-label">☀️ 环境光照强度 (GL5516)</div>
                <div class="sensor-value text-gradient-light"><span id="val-light">----</span><span style="font-size: 2rem;">Lx</span></div>
            </div>
        </section>

        <section class="bottom-module">
            
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">🕹️ 硬件执行器网络</h2>
                    <div class="mode-toggle mode-auto-active" id="mode-wrapper">
                        <div class="mode-slider"></div>
                        <div class="mode-btn active" id="mode-auto" onclick="setMode('auto')">AUTO</div>
                        <div class="mode-btn" id="mode-manual" onclick="setMode('manual')">MANUAL</div>
                    </div>
                </div>

                <div class="actuator-grid">
                    <div class="actuator-item">
                        <div class="actuator-icon" id="icon-light" style="color: #ffeb3b;">💡</div>
                        <span style="color: #8ba1b7; font-size: 0.9rem;">Relay 3 (照明)</span>
                        <label class="switch">
                            <input type="checkbox" id="sw-light" disabled onchange="sendCmd(3, this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="actuator-item">
                        <div class="actuator-icon" id="icon-fan" style="color: #00bcd4;">🌀</div>
                        <span style="color: #8ba1b7; font-size: 0.9rem;">Relay 4 (排风)</span>
                        <label class="switch">
                            <input type="checkbox" id="sw-fan" disabled onchange="sendCmd(4, this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">⚙️ 触发阈值设定</h2>
                </div>
                
                <div class="th-group">
                    <div class="th-info">
                        <span class="th-label">温度上限警戒线</span>
                        <span class="th-current" id="cur-th-temp">-- ℃</span>
                    </div>
                    <div class="th-input-area">
                        <input type="number" id="input-th-temp" value="32">
                        <button onclick="sendThreshold()">更新</button>
                    </div>
                </div>

                <div class="th-group" style="margin-bottom: 0;">
                    <div class="th-info">
                        <span class="th-label">光照暗度触发线</span>
                        <span class="th-current" id="cur-th-light">-- Lx</span>
                    </div>
                    <div class="th-input-area">
                        <input type="number" id="input-th-light" value="1000">
                        <button onclick="sendThreshold()">更新</button>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <div class="terminal-container">
        <div class="terminal-btn" onclick="toggleTerminal()">
            <span>💻 终端监测日志</span>
            <span id="log-count" style="background:#00f2fe; color:#000; padding:2px 8px; border-radius:10px; font-weight:bold;">0</span>
        </div>
        <div class="terminal-box" id="terminal-box"></div>
    </div>

    <script>
        let mqttClient;
        let isAutoMode = true; 
        let logCounter = 0;
        let isConnected = false;

        const ledMqtt = document.getElementById("mqtt-led");
        const ledDev = document.getElementById("dev-led");
        const terminalBox = document.getElementById("terminal-box");
        const btnConnect = document.getElementById("connect-btn");

        function toggleTerminal() {
            terminalBox.style.display = terminalBox.style.display === 'block' ? 'none' : 'block';
        }

        function printLog(msg, isErr = false) {
            const timeStr = new Date().toLocaleTimeString();
            const p = document.createElement("p");
            const colorClass = isErr ? 'log-err' : 'log-msg';
            p.innerHTML = `<span class="log-time">[${timeStr}]</span> <span class="${colorClass}">${msg}</span>`;
            terminalBox.appendChild(p);
            terminalBox.scrollTop = terminalBox.scrollHeight;
            document.getElementById("log-count").innerText = ++logCounter;
        }

        function toggleConnection() {
            const broker = document.getElementById("server-env").value;
            const devId = document.getElementById("device-id").value;
            const pwd = document.getElementById("mqtt-pwd").value; 

            if (!isConnected) {
                if (!pwd) { alert("访问密钥不能为空！"); return; }
                btnConnect.innerText = "正在建立连接...";
                printLog(`尝试接入服务器: ${broker}...`);
                
                const clientId = "WebUI_" + Math.random().toString(16).substring(2, 8);
                mqttClient = new Paho.MQTT.Client(broker, 8083, clientId);
                mqttClient.onConnectionLost = onConnectionLost;
                mqttClient.onMessageArrived = onMessageArrived;

                mqttClient.connect({
                    useSSL: false,              
                    userName: "dzdx_emqx",      
                    password: pwd,              
                    onSuccess: () => {
                        isConnected = true;
                        btnConnect.innerText = "核心已连接 (点击断开)";
                        btnConnect.classList.add("connected");
                        ledMqtt.className = "led on";
                        printLog("MQTT 验证通过，信道已建立。");
                        
                        const subTopic = `chemctrl/${devId}/status`;
                        mqttClient.subscribe(subTopic);
                        printLog(`监听下位机频道: ${subTopic}`);
                        publishCmd({ "cmd": "get_status" });
                    },
                    onFailure: (err) => {
                        btnConnect.innerText = "启动核心连接";
                        printLog(`连接阻断: ${err.errorMessage}`, true);
                        ledMqtt.className = "led err";
                    }
                });
            } else {
                if (mqttClient) mqttClient.disconnect();
                isConnected = false;
                btnConnect.innerText = "启动核心连接";
                btnConnect.classList.remove("connected");
                ledMqtt.className = "led";
                ledDev.className = "led";
                printLog("已主动切断与服务器的连接。");
                resetData();
            }
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                isConnected = false;
                btnConnect.innerText = "启动核心连接";
                btnConnect.classList.remove("connected");
                printLog(`通信链路异常中断: ${responseObject.errorMessage}`, true);
                ledMqtt.className = "led err";
                ledDev.className = "led";
            }
        }

        function onMessageArrived(message) {
            try {
                const payload = JSON.parse(message.payloadString);
                printLog(`[RECV] ${message.payloadString}`);
                ledDev.className = "led on";

                if(payload.temperature !== undefined) document.getElementById("val-temp").innerText = payload.temperature;
                if(payload.light !== undefined) document.getElementById("val-light").innerText = payload.light;
                if(payload.temp_threshold !== undefined) document.getElementById("cur-th-temp").innerText = payload.temp_threshold + " ℃";
                if(payload.light_threshold !== undefined) document.getElementById("cur-th-light").innerText = payload.light_threshold + " Lx";

                if(payload.mode !== undefined) syncUIMode(payload.mode);
                if(!isAutoMode) {
                    if(payload.relay3 !== undefined) updateDeviceUI('light', payload.relay3);
                    if(payload.relay4 !== undefined) updateDeviceUI('fan', payload.relay4);
                }
            } catch(e) {
                printLog("数据帧解析失败", true);
            }
        }

        function setMode(mode) {
            publishCmd({ "cmd": "set_mode", "mode": mode });
            syncUIMode(mode);
        }

        function syncUIMode(mode) {
            isAutoMode = (mode === 'auto');
            const wrapper = document.getElementById("mode-wrapper");
            const btnAuto = document.getElementById("mode-auto");
            const btnManual = document.getElementById("mode-manual");

            if (isAutoMode) {
                wrapper.className = "mode-toggle mode-auto-active";
                btnAuto.classList.add("active"); btnManual.classList.remove("active");
            } else {
                wrapper.className = "mode-toggle mode-manual-active";
                btnManual.classList.add("active"); btnAuto.classList.remove("active");
            }
            
            document.getElementById("sw-light").disabled = isAutoMode;
            document.getElementById("sw-fan").disabled = isAutoMode;
        }

        function sendThreshold() {
            const tempVal = document.getElementById(`input-th-temp`).value;
            const lightVal = document.getElementById(`input-th-light`).value;
            let cmd = { "cmd": "set_threshold", "temp": parseFloat(tempVal), "light": parseInt(lightVal) };
            publishCmd(cmd);
        }

        function sendCmd(relayNum, state) {
            let cmd = { "cmd": "set_relay", "relay": relayNum, "value": state };
            let device = relayNum === 3 ? 'light' : 'fan';
            updateDeviceUI(device, state);
            publishCmd(cmd);
        }

        function updateDeviceUI(device, state) {
            document.getElementById(`sw-${device}`).checked = state;
            const icon = document.getElementById(`icon-${device}`);
            if(state) icon.classList.add("active"); else icon.classList.remove("active");
        }

        function publishCmd(jsonObj) {
            if (!mqttClient || !mqttClient.isConnected()) { alert("核心未连接！"); return; }
            const devId = document.getElementById("device-id").value;
            const pubTopic = `chemctrl/${devId}/command`; 
            const message = new Paho.MQTT.Message(JSON.stringify(jsonObj));
            message.destinationName = pubTopic;
            mqttClient.send(message);
            printLog(`[SEND] ${JSON.stringify(jsonObj)}`);
        }

        function resetData() {
            document.getElementById("val-temp").innerText = "--.-";
            document.getElementById("val-light").innerText = "----";
        }
    </script>
</body>
</html>
