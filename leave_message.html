<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我要留言 - 给吕岳的悄悄话</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-main: #2d3436;
            --text-muted: #636e72;
            --primary-color: #0072ff;
        }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 0;
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 顶部导航栏与 friend.html 保持一致 */
        .navbar {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            padding: 15px 0;
            margin-bottom: 30px;
        }

        .navbar a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 1.1rem;
            margin: 0 15px;
            padding: 8px 20px;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .navbar a.active, .navbar a:hover {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(0, 114, 255, 0.3);
        }

        .container {
            max-width: 600px; /* 输入界面不需要太宽 */
            margin: 0 auto 40px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .art-title {
            font-size: 1.8rem;
            color: #2d3436;
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
        }

        .art-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: #0072ff;
            border-radius: 2px;
        }

        /* ================= 表单样式 ================= */
        .form-group {
            text-align: left;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid rgba(0, 114, 255, 0.2);
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            box-sizing: border-box; /* 确保不超宽 */
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(0, 114, 255, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            background: linear-gradient(120deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.3);
            transition: all 0.3s ease;
            width: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.4);
        }

    </style>
</head>
<body>

    <!-- 顶部导航栏 -->
    <div class="navbar">
        <a href="friend.html">📜 盲盒留言墙</a>
        <!-- 当前页面，设置 active 样式 -->
        <a href="leave_message.html" class="active">✏️ 匿名写留言</a> 
    </div>

    <div class="container">
        <div class="card">
            <h2 class="art-title">增加一条“虎狼之词”</h2>
            
            <form id="messageForm">
                <div class="form-group">
                    <label for="nicknameId">😎 给你自己起个匿名 ID：</label>
                    <input type="text" id="nicknameId" placeholder="例如：某不知名的学弟..." required>
                </div>
                
                <div class="form-group">
                    <label for="messageContent">💬 最想对吕岳说的话：</label>
                    <textarea id="messageContent" placeholder="在此输入你的真情告白或疯狂吐槽..." required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">发射留言 🚀</button>
            </form>
        </div>
    </div>

    <!-- 存入本地浏览器的 JavaScript 逻辑 -->
    <script>
        document.getElementById('messageForm').addEventListener('submit', function(event) {
            // 阻止表单默认的刷新提交动作
            event.preventDefault();

            // 获取输入框里的内容
            let idValue = document.getElementById('nicknameId').value;
            let contentValue = document.getElementById('messageContent').value;

            // 把当前留言打包成一个对象
            let newMessage = {
                id: idValue,
                content: contentValue
            };

            // 获取之前的留言，如果没有就创建一个空数组
            let existingMessages = JSON.parse(localStorage.getItem('lyMessages')) || [];
            
            // 把新留言塞进数组里
            existingMessages.push(newMessage);

            // 把更新后的数组重新存入本地浏览器
            localStorage.setItem('lyMessages', JSON.stringify(existingMessages));

            // 提示成功，并自动跳转回展示页面
            alert("留言发射成功！这就带你回去看。");
            window.location.href = "friend.html";
        });
    </script>
</body>
</html>
