<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCT-100 高级过程控制终端</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        /* ================= 极客科技风主题配置 ================= */
        :root {
            --bg-color: #0b0c10;
            --glass-bg: rgba(31, 40, 51, 0.65);
            --glass-border: rgba(69, 162, 158, 0.3);
            --text-main: #c5c6c7;
            --text-highlight: #66fcf1;
            --accent-cyan: #45a29e;
            --accent-red: #ff4655;
            --accent-green: #00e676;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0b0c10 0%, #1f2833 100%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 隐藏滚动条但保留滚动功能 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 4px; }

        /* ================= 毛玻璃通用面板 ================= */
        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        .panel:hover { border-color: var(--text-highlight); box-shadow: 0 8px 32px rgba(102, 252, 241, 0.15); }

        .panel-title {
            color: var(--text-highlight);
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        /* ================= 顶部控制台 ================= */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #fff;
            text-shadow: 0 0 10px var(--text-highlight);
            letter-spacing: 2px;
        }
        .brand span { font-size: 0.9rem; color: var(--accent-cyan); }

        .connection-group {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
        }

        input[type="text"], input[type="password"], input[type="number"] {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--accent-cyan);
            color: var(--text-highlight);
            padding: 6px 12px;
            border-radius: 6px;
            outline: none;
            font-family: monospace;
        }
        
        /* 状态指示灯 */
        .indicator { width: 12px; height: 12px; border-radius: 50%; display: inline-block; background: #555; box-shadow: 0 0 5px #000; }
        .indicator.on { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .indicator.err { background: var(--accent-red); box-shadow: 0 0 10px var(--accent-red); }

        /* 定制开关按钮 (Toggle) */
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; vertical-align: middle; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 26px; border: 1px solid var(--glass-border); }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: #fff; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-cyan); box-shadow: 0 0 10px var(--accent-cyan); }
        input:checked + .slider:before { transform: translateX(24px); }
        input:disabled + .slider { cursor: not-allowed; opacity: 0.5; }

        /* ================= 主网格布局 ================= */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* 传感器大字号显示 */
        .sensor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .sensor-card { text-align: center; padding: 20px; background: rgba(0,0,0,0.2); border-radius: 10px; border: 1px dashed var(--glass-border); }
        .sensor-val { font-size: 3rem; font-weight: bold; color: var(--text-highlight); text-shadow: 0 0 15px rgba(102, 252, 241, 0.4); margin: 10px 0; font-family: 'Courier New', Courier, monospace; }
        
        /* 阈值下发区 */
        .threshold-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: rgba(0,0,0,0.2); padding: 10px 15px; border-radius: 8px; }
        .btn-send { background: transparent; border: 1px solid var(--accent-cyan); color: var(--text-highlight); padding: 6px 15px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .btn-send:hover { background: var(--accent-cyan); color: #000; box-shadow: 0 0 10px var(--accent-cyan); }

        /* 执行器控制区 */
        .control-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .mode-tags { display: flex; gap: 10px; }
        .mode-tag { padding: 4px 12px; border-radius: 15px; font-size: 0.85rem; border: 1px solid #555; color: #888; cursor: pointer; transition: all 0.3s; }
        .mode-tag.active { border-color: var(--text-highlight); color: var(--text-highlight); background: rgba(102, 252, 241, 0.1); box-shadow: 0 0 8px rgba(102, 252, 241, 0.3); }
        
        .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: center; }
        .device-item { padding: 15px; background: rgba(0,0,0,0.2); border-radius: 10px; }
        .device-icon { font-size: 2.5rem; margin-bottom: 15px; filter: grayscale(100%); transition: all 0.3s; }
        .device-icon.active { filter: grayscale(0%); text-shadow: 0 0 15px currentColor; }
        .warning-text { text-align: center; color: var(--accent-red); font-size: 0.85rem; margin-top: 20px; opacity: 0; transition: opacity 0.3s; }

        /* ================= 底部终端日志 ================= */
        .terminal { margin-top: 20px; }
        .log-box { height: 150px; background: #000; color: #0f0; font-family: monospace; font-size: 0.9rem; padding: 15px; overflow-y: auto; border-radius: 8px; border: 1px solid #333; display: none; }
        .log-box p { margin: 2px 0; }
        .log-time { color: #888; margin-right: 10px; }
    </style>
</head>
<body>

    <div class="panel top-bar">
        <div class="brand">
            <h1>PCT-100</h1>
            <span>化工过程控制实训装置 · 高级终端</span>
        </div>
        
        <div class="connection-group">
            <span title="IP由截图指定">🌐 服务器: <input type="text" id="server-env" value="47.98.170.180" style="width: 120px;" readonly></span>
            <span>设备: <input type="text" id="device-id" value="PCT_100_001" style="width: 120px;"></span>
            
            <span>🔑 密码: <input type="password" id="mqtt-pwd" value="Jp4!sQ7$" style="width: 90px;"></span>
            
            <div style="display: flex; align-items: center; gap: 8px; margin-left: 10px;">
                <span>MQTT</span> <div id="mqtt-led" class="indicator"></div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span>设备在线</span> <div id="dev-led" class="indicator"></div>
            </div>

            <label class="switch">
                <input type="checkbox" id="connect-toggle" onchange="toggleConnection()">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="main-grid">
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="panel">
                <div class="panel-title">📡 实时传感器数据</div>
                <div class="sensor-grid">
                    <div class="sensor-card">
                        <div style="color: #888;">温度 DS18B20</div>
                        <div class="sensor-val" id="val-temp">--.-</div>
                        <div style="color: var(--accent-cyan);">℃</div>
                    </div>
                    <div class="sensor-card">
                        <div style="color: #888;">光照 GL5516</div>
                        <div class="sensor-val" id="val-light">----</div>
                        <div style="color: var(--accent-cyan);">Lux / ADC</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">⚙️ 告警阈值设置</div>
                
                <div class="threshold-row">
                    <span>当前 <span id="cur-th-temp" style="color:var(--text-highlight);">--</span> ℃</span>
                    <div>
                        温度阈值 <input type="number" id="input-th-temp" value="32" style="width: 60px;">
                        <button class="btn-send" onclick="sendThreshold()">下发</button>
                    </div>
                </div>

                <div class="threshold-row">
                    <span>当前 <span id="cur-th-light" style="color:var(--text-highlight);">--</span> Lx</span>
                    <div>
                        光照阈值 <input type="number" id="input-th-light" value="1000" style="width: 60px;">
                        <button class="btn-send" onclick="sendThreshold()">下发</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel" style="display: flex; flex-direction: column;">
            <div class="control-header">
                <div class="panel-title" style="border:none; margin:0;">🕹️ 执行器控制</div>
                <div class="mode-tags">
                    <div class="mode-tag active" id="mode-auto" onclick="setMode('auto')">自动模式</div>
                    <div class="mode-tag" id="mode-manual" onclick="setMode('manual')">手动控制</div>
                </div>
            </div>

            <div class="device-grid" style="flex-grow: 1; align-items: center;">
                <div class="device-item">
                    <div class="device-icon" id="icon-light" style="color: #ffeb3b;">💡</div>
                    <div style="margin-bottom: 10px;">灯光 (继电器3)</div>
                    <label class="switch">
                        <input type="checkbox" id="sw-light" disabled onchange="sendCmd(3, this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="device-item">
                    <div class="device-icon" id="icon-fan" style="color: #00bcd4;">🌀</div>
                    <div style="margin-bottom: 10px;">风扇 (继电器4)</div>
                    <label class="switch">
                        <input type="checkbox" id="sw-fan" disabled onchange="sendCmd(4, this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="warning-text" id="auto-warning" style="opacity: 1;">⚠️ 当前为自动模式，执行器由设备硬件依据阈值自动控制。</div>
        </div>
    </div>

    <div class="panel terminal">
        <div class="panel-title" style="margin-bottom: 0; border: none; justify-content: space-between;">
            <span>💻 终端调试日志 <span id="log-count" style="background:var(--accent-cyan); color:#000; padding:2px 8px; border-radius:10px; font-size:0.8rem; margin-left:10px;">0</span></span>
            <label class="switch">
                <input type="checkbox" onchange="document.getElementById('terminal-box').style.display = this.checked ? 'block' : 'none'">
                <span class="slider"></span>
            </label>
        </div>
        <div class="log-box" id="terminal-box"></div>
    </div>

    <script>
        let mqttClient;
        let isAutoMode = true; 
        let logCounter = 0;

        const ledMqtt = document.getElementById("mqtt-led");
        const ledDev = document.getElementById("dev-led");
        const terminalBox = document.getElementById("terminal-box");

        function printLog(msg, isErr = false) {
            const timeStr = new Date().toLocaleTimeString();
            const p = document.createElement("p");
            p.innerHTML = `<span class="log-time">[${timeStr}]</span> <span style="color:${isErr? '#ff4655' : '#0f0'}">${msg}</span>`;
            terminalBox.appendChild(p);
            terminalBox.scrollTop = terminalBox.scrollHeight;
            document.getElementById("log-count").innerText = ++logCounter;
        }

        // 切换连接状态
        function toggleConnection() {
            const isConnect = document.getElementById("connect-toggle").checked;
            const broker = document.getElementById("server-env").value;
            const devId = document.getElementById("device-id").value;
            const pwd = document.getElementById("mqtt-pwd").value; 

            if (isConnect) {
                printLog(`正在连接至服务器: ${broker}...`);
                const clientId = "WebUI_" + Math.random().toString(16).substring(2, 8);
                
                // ⚠️ 核心修复：网页端必须使用 WebSocket 端口 8083 (PPT 明确规定)
                mqttClient = new Paho.MQTT.Client(broker, 8083, clientId);
                mqttClient.onConnectionLost = onConnectionLost;
                mqttClient.onMessageArrived = onMessageArrived;

                mqttClient.connect({
                    useSSL: false,              
                    userName: "dzdx_emqx",      
                    password: pwd,              
                    onSuccess: () => {
                        printLog("MQTT 服务器连接成功！身份验证通过。");
                        ledMqtt.className = "indicator on";
                        
                        // ⚠️ 核心修复：修改订阅 Topic 符合 PPT 规范 chemctrl/{device_id}/status
                        const subTopic = `chemctrl/${devId}/status`;
                        mqttClient.subscribe(subTopic);
                        printLog(`已订阅设备数据主题: ${subTopic}`);
                        
                        // 连接成功后发送一次 get_status 获取最新状态
                        publishCmd({ "cmd": "get_status" });
                    },
                    onFailure: (err) => {
                        printLog(`连接失败 (请检查端口或校园网限制): ${err.errorMessage}`, true);
                        document.getElementById("connect-toggle").checked = false;
                        ledMqtt.className = "indicator err";
                    }
                });
            } else {
                if (mqttClient) mqttClient.disconnect();
                printLog("已断开服务器连接。");
                ledMqtt.className = "indicator";
                ledDev.className = "indicator";
                resetData();
            }
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                printLog(`连接意外丢失: ${responseObject.errorMessage}`, true);
                document.getElementById("connect-toggle").checked = false;
                ledMqtt.className = "indicator err";
                ledDev.className = "indicator";
            }
        }

        // 处理接收到的传感器数据
        function onMessageArrived(message) {
            try {
                const payload = JSON.parse(message.payloadString);
                printLog(`收到设备数据: ${message.payloadString}`);
                
                ledDev.className = "indicator on";

                // 解析更新数据 (严格匹配 PPT 键名规范)
                if(payload.temperature !== undefined) document.getElementById("val-temp").innerText = payload.temperature;
                if(payload.light !== undefined) document.getElementById("val-light").innerText = payload.light;
                
                if(payload.temp_threshold !== undefined) document.getElementById("cur-th-temp").innerText = payload.temp_threshold;
                if(payload.light_threshold !== undefined) document.getElementById("cur-th-light").innerText = payload.light_threshold;

                // 同步模式
                if(payload.mode !== undefined) {
                    syncUIMode(payload.mode);
                }

                // 同步硬件反馈的执行器真实状态 (严格匹配 relay3 和 relay4)
                if(payload.relay3 !== undefined) updateDeviceUI('light', payload.relay3);
                if(payload.relay4 !== undefined) updateDeviceUI('fan', payload.relay4);

            } catch(e) {
                printLog("数据解析异常", true);
            }
        }

        // 发送手/自动模式指令
        function setMode(mode) {
            publishCmd({ 
                "cmd": "set_mode", 
                "mode": mode 
            });
            syncUIMode(mode);
        }

        function syncUIMode(mode) {
            isAutoMode = (mode === 'auto');
            document.getElementById("mode-auto").className = isAutoMode ? "mode-tag active" : "mode-tag";
            document.getElementById("mode-manual").className = !isAutoMode ? "mode-tag active" : "mode-tag";
            document.getElementById("auto-warning").style.opacity = isAutoMode ? "1" : "0";
            
            document.getElementById("sw-light").disabled = isAutoMode;
            document.getElementById("sw-fan").disabled = isAutoMode;
        }

        // ⚠️ 核心修复：下发阈值指令严格遵循 PPT JSON 格式
        function sendThreshold() {
            const tempVal = document.getElementById(`input-th-temp`).value;
            const lightVal = document.getElementById(`input-th-light`).value;
            
            let cmd = {
                "cmd": "set_threshold",
                "temp": parseFloat(tempVal),
                "light": parseInt(lightVal)
            };
            
            publishCmd(cmd);
            printLog(`已下发阈值 -> 温度:${tempVal}, 光照:${lightVal}`);
        }

        // ⚠️ 核心修复：下发继电器控制指令严格遵循 PPT JSON 格式
        function sendCmd(relayNum, state) {
            let cmd = {
                "cmd": "set_relay",
                "relay": relayNum,
                "value": state
            };
            
            let device = relayNum === 3 ? 'light' : 'fan';
            updateDeviceUI(device, state);
            publishCmd(cmd);
        }

        function updateDeviceUI(device, state) {
            document.getElementById(`sw-${device}`).checked = state;
            const icon = document.getElementById(`icon-${device}`);
            if(state) icon.classList.add("active");
            else icon.classList.remove("active");
        }

        function publishCmd(jsonObj) {
            if (!mqttClient || !mqttClient.isConnected()) {
                alert("请先连接 MQTT 服务器！");
                return;
            }
            const devId = document.getElementById("device-id").value;
            // ⚠️ 核心修复：修改下发 Topic 符合 PPT 规范 chemctrl/{device_id}/command
            const pubTopic = `chemctrl/${devId}/command`; 
            
            const message = new Paho.MQTT.Message(JSON.stringify(jsonObj));
            message.destinationName = pubTopic;
            mqttClient.send(message);
            printLog(`[发送指令] -> ${JSON.stringify(jsonObj)}`);
        }

        function resetData() {
            document.getElementById("val-temp").innerText = "--.-";
            document.getElementById("val-light").innerText = "----";
        }
    </script>
</body>
</html>
